  output-dir: _site
  # Only these files are rendered. The R and Python lessons elsewhere in the
  # repo are left alone.
  render:
    - index.qmd
    - probability-teacher-edition.qmd

website:
  title: "High Low"
  repo-url: https://github.com/chelsyschnabel/HighLow
  repo-actions: [source, issue]
